<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2545">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="رحلات المطار">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<title>سجل الرحلات الخاصة</title>
<style>
:root{--navy:#0b2545;--navy2:#13315c;--cyan:#00a3b4;--ink:#0f1b2d;--mute:#5b6b80;--line:#d5dde8;--bg:#f3f6fa;--card:#fff;--amber:#b7791f;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Noto Kufi Arabic",Tahoma,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%;line-height:1.6}
#top{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 20px 12px;display:flex;align-items:center;gap:16px;border-bottom:4px solid var(--cyan)}
#top .logo{height:44px;width:auto}
#top .ttl{flex:1;min-width:0}
#top h2{margin:0;font-size:18px;font-weight:600}
#top button.g{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
#top button.g:hover{background:rgba(255,255,255,.1)}
#home{max-width:880px;margin:0 auto;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 48px)}
#app{display:flex;flex-direction:column;gap:12px}
.card,.trip{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
.trip{border-inline-start:4px solid var(--navy);display:flex;flex-direction:column;gap:4px}
.trip.upc{border-inline-start-color:var(--amber)}
.trip img{height:44px;width:auto;align-self:flex-start;border:1px solid var(--line);border-radius:4px;background:#fff}
button{font:inherit}
button.b{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:6px;padding:10px 14px;font-size:14.5px;font-weight:600;cursor:pointer}
button.b:hover{background:var(--navy2)}
button.g{background:#fff;color:var(--navy);border:1px solid var(--navy)}
button.g:hover{background:#eef3f9}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--mute);font-weight:500}
input,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,163,180,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px}
#sig{width:100%;height:170px;background:#fff;border:1.5px dashed var(--navy);border-radius:6px;touch-action:none;display:block}
.sl{font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row input{width:auto;flex:1;min-width:150px}
.col{display:flex;flex-direction:column;gap:12px}
.small{font-size:13px;color:var(--mute)}
.err{color:#b3261e;min-height:1.2em;margin:0}
.nb{background:var(--cyan);color:#fff;border-radius:4px;padding:1px 8px;font-size:12px;margin-inline-start:8px;font-weight:600}
.nb.up{background:var(--amber)}
#splash{position:fixed;inset:0;z-index:9;background:var(--navy);display:flex;align-items:center;justify-content:center;transition:opacity .7s ease,visibility .7s;cursor:pointer}
#splash.out{opacity:0;visibility:hidden}
.sp{text-align:center;color:#fff;padding:24px}
.sp img{width:min(320px,70vw);height:auto;opacity:0;animation:in 1s ease .2s forwards}
.sp .bar{height:3px;width:0;background:var(--cyan);margin:18px auto 14px;animation:grow 1s ease .9s forwards}
.sp p{margin:0;font-size:18px;opacity:0;animation:in .8s ease 1.3s forwards}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{to{width:min(220px,50vw)}}
@media (prefers-reduced-motion:reduce){.sp img,.sp p{animation:none;opacity:1}.sp .bar{animation:none;width:160px}}
.inl{display:flex;gap:8px}.inl input{flex:1}.inl button{flex:none;padding:8px 12px}
#sig.big{height:300px}
.cap{font-size:20px;line-height:1.9;display:flex;flex-direction:column;gap:2px}.cap b{font-size:15px;color:var(--mute)}
.bigs{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.big{background:#fff;border:1px solid var(--line);border-inline-start:6px solid var(--navy);border-radius:8px;padding:34px 22px;font:inherit;font-size:21px;font-weight:600;color:var(--navy);cursor:pointer;text-align:start}
.big.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.card.f{display:flex;flex-direction:column;gap:12px}
@media (max-width:520px){#top{padding-inline:14px;gap:10px}#top .logo{height:36px}#top h2{font-size:15px}}
</style>
</head>

watchLogins:function(ok,bad){return onSnapshot(query(collection(db,"logins"),orderBy("at","desc"),limit(60)),function(s){ok(s.docs.map(function(d){var o=d.data({serverTimestamps:"estimate"});o.id=d.id;o.at=o.at&&o.at.toMillis?o.at.toMillis():0;return o}))},bad)},
